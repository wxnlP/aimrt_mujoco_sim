aimrt:
  plugin:
    plugins:
      - name: net_plugin
        path: ./libaimrt_net_plugin.so
        options:
          thread_num: 4
          http_options:
            listen_ip: 127.0.0.1
            listen_port: 50080
      - name: echo_plugin
        path: ./libaimrt_echo_plugin.so
        options:
          type_support_pkgs:
            - path: ./libcamera_pb_ts.so
          topic_meta_list:
            - topic_name: /examples_hardware/camera/depth/camera_info
              msg_type: pb:aimrt_mujoco_sim.protocols.sensor.CameraInfo
              echo_type: json
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  executor:
    executors:
      - name: gui_thread
        type: simple_thread
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 4
  channel:
    backends:
      - type: local
      - type: http
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [http, local]
    pub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [local]
  module:
    pkgs:
      - path: ./libmujoco_sim_pkg.so
        enable_modules: [MujocoSimModule]
    modules:
      - name: MujocoSimModule
        log_lvl: INFO

# Module custom configuration
MujocoSimModule:
  simulation_model_path: ./cfg/model/examples_hardware_camera_model.xml
  sim_executor: work_thread_pool
  gui_executor: gui_thread
  camera_options:
    - type: camera_sensor
      frequency: 10
      executor: work_thread_pool
      color_topic: /examples_hardware/camera/color/image_raw
      depth_topic: /examples_hardware/camera/depth/image_raw
      info_topic: /examples_hardware/camera/depth/camera_info
      options:
        bind_camera: camera
        width: 640
        height: 480
